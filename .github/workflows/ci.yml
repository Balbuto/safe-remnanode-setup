name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Verify sources, standalone build and both entry points
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck and jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq

      - name: Verify committed standalone build and vendored checksums
        run: python3 tools/build_standalone.py --check

      - name: Bash syntax and ShellCheck
        run: |
          for file in safe-remnanode-setup*.sh lib/*.sh tests/smoke.sh; do bash -n "$file"; done
          shellcheck -x safe-remnanode-setup*.sh tests/smoke.sh

      - name: Smoke tests — standalone
        run: bash tests/smoke.sh

      - name: Smoke tests — modular sources
        env:
          REMNA_ENTRYPOINT: ./safe-remnanode-setup-modular.sh
        run: bash tests/smoke.sh
